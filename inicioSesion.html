<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio/Registro session</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
        <header>
            <a href="index.html" class="logo"><img src="img/micelaneos/logoTa.png" alt="Logo de la tienda T A"></a>
            <input type="text" id="taskInput" placeholder="Ingrese un nombre a buscar">
            <div class="iconos-header">
                <a href="inicioSesion.html"><img src="img/micelaneos/usuario.png" alt="Registro/Sesión" class="icono"></a>
                <a href="carrito.html"><img src="img/micelaneos/carrito-de-compras.png" alt="Carrito de compras" class="icono"></a>
            </div>
        </header>

        <div class="contenedor-pagina">
            <aside class="barraLateral">
                <nav>
                    <h2>Secciones</h2>
                    <ul>
                        <a href="videojuegos.html"><h3>Videojuegos</h3></a>
                        <a href="figuras.html"><h3>Figuras</h3></a>
                        <h3>Mangas</h3>
                    </ul>
                </nav>
            </aside>

        <main class="centrar-body">
            <div class="contenedor-formulario">
                <h2>Iniciar Sesión</h2>
                <form id="formLogin">
                    <div class="campo-form">
                        <label for="inputUsuario">Usuario o Correo:</label>
                        <input type="text" id="inputUsuario" placeholder="Ej. UsuarioGenerico">
                        <span id="errorUsuario" class="error-campo"></span>
                    </div>

                    <div class="campo-form">
                        <label for="inputPassword">Contraseña:</label>
                        <input type="password" id="inputPassword" placeholder="••••••••">
                        <span id="errorPassword" class="error-campo"></span>
                    </div>

                    <button type="submit" class="btn-submit">Ingresar</button>
                </form>
            </div>
        </main>
        </div>

        <footer>
            <h3>Tienda A. Página diseñada por Jorge Martinez. 2026</h3>
        </footer>

        <script src="script.js"></script>
    </body>
